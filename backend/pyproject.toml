[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-globe-backend"
version = "0.1.0"
requires-python = ">=3.12"
# 허용 범위. 실제 설치는 잠금 파일(requirements.lock / requirements-dev.lock)로 고정한다.
# 다시 만들기: uv pip compile pyproject.toml --universal --python-version 3.12 --generate-hashes -o requirements.lock
dependencies = [
  "fastapi>=0.142,<0.143",
  "uvicorn[standard]>=0.53,<0.54",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<1.21",
  "psycopg[binary]>=3.3,<3.4",
  "pydantic>=2.13,<2.14",
  "pydantic-settings>=2.15,<2.16",
  "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx>=0.28,<0.29"]  # httpx: FastAPI TestClient

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
