# 푸시·PR마다 백엔드 테스트(SQLite·PostgreSQL)·마이그레이션 왕복과 화면 린트·타입 검사·빌드·의존성 점검·Docker 이미지 빌드를 확인한다.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: photoglobe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - name: pytest (SQLite)
        run: pytest -q
      - name: pytest (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/photoglobe_test
      - name: migrations match models
        run: |
          python -c "import psycopg; psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True).execute('CREATE DATABASE photoglobe_migrate')"
          alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/photoglobe_migrate
          SECRET_KEY: ci-only-secret-key-0123456789abcdefghijklmnop

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev

  frontend-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build image
        run: docker build -t photo-globe-frontend:ci frontend
